name: Manual Check — iBoomto
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date YYYY-MM-DD
        required: true
      end_date:
        description: End date YYYY-MM-DD
        required: true
      source:
        type: choice
        options: [all, ga, gsc]
        default: all
      language:
        type: choice
        options: [all, en, ar, ja, zh-tw, es, de, fr, it, pt]
        default: all
      url:
        description: Exact iBoomto page URL
        required: false
      prefix:
        description: Optional path prefix
permissions:
  contents: read
concurrency:
  group: iboomto-sheets-writer
  cancel-in-progress: false
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-iboomto.txt
      - name: Query iBoomto and the equal-length baseline
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          IBOOMTO_SHEET_ID: '1Iw07GRTmwK4GoE3zPpGYG-rdneBHchYIb6-s-knFLvs'
          INPUT_MODE: manual
          INPUT_START: ${{ inputs.start_date }}
          INPUT_END: ${{ inputs.end_date }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_PREFIX: ${{ inputs.prefix }}
        run: python -m iboomto.dispatch
