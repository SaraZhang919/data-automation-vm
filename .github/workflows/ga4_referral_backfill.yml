name: GA4 Referral backfill — iBoomto

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: iboomto-sheets-writer
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-iboomto.txt
      - run: python -m unittest discover -s tests -p 'test_referral.py' -v
      - name: Populate referral history
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          IBOOMTO_SHEET_ID: '1Iw07GRTmwK4GoE3zPpGYG-rdneBHchYIb6-s-knFLvs'
        run: python -m iboomto.referral
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga4-referral-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/ga4-referral-backfill.json
          if-no-files-found: warn
          retention-days: 30
