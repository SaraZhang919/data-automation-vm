name: Manual URL Inspection — iBoomto

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Language filter; maximum 1,000 URLs per run.'
        type: choice
        default: all
        options: [all, en, ar, ja, zh-tw, es, de, fr, it, pt]
      urls:
        description: 'Maximum 1,000 URLs per run. Leave both URLs and URL regex blank to inspect all known URLs in the selected language, or all languages if Language = all. Otherwise enter comma/newline-separated URLs.'
        type: string
        required: false
      url_regex:
        description: 'URL regex: case-sensitive Python re.search, e.g. /blog/|/how-to/. Use instead of URLs; language applies first. Maximum 1,000 matches.'
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: iboomto-sheets-writer
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-iboomto.txt
      - name: Verify URL inspection invariants
        run: python -m unittest discover -s tests -p 'test*inspection*.py' -v
      - name: Inspect selected URLs
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          IBOOMTO_SHEET_ID: '1Iw07GRTmwK4GoE3zPpGYG-rdneBHchYIb6-s-knFLvs'
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_URLS: ${{ inputs.urls }}
          INPUT_URL_REGEX: ${{ inputs.url_regex }}
        run: python -m iboomto.manual_inspection
      - name: Preserve per-run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-url-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/manual-url-inspection.json
            runtime/manual-url-inspection-summary.md
          if-no-files-found: warn
          retention-days: 30
