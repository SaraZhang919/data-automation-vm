name: Monthly

on:
  schedule:
    - cron: "0 7 4 * *"   # 4 PM JST (UTC+9) on the 4th of every month
  workflow_dispatch:
    inputs:
      run_date:
        description: "Reference date (YYYY-MM-DD). Use the 4th of a past month to test."
        required: false
        default: ""
      script:
        description: "Which script to run"
        required: false
        default: "All"
        type: choice
        options:
          - All
          - 4-week Site GA4
          - 4-week Page GA4
          - 4-week Page GSC
          - 4-week Site GSC

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 4-week site GA4
        if: inputs.script == '' || inputs.script == 'All' || inputs.script == '4-week Site GA4'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/monthly_site_ga4.py --date "$RUN_DATE"
          else
            python scripts/monthly_site_ga4.py
          fi

      - name: Run 4-week page GA4
        if: inputs.script == '' || inputs.script == 'All' || inputs.script == '4-week Page GA4'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/monthly_page_ga4.py --date "$RUN_DATE"
          else
            python scripts/monthly_page_ga4.py
          fi

      - name: Run 4-week page GSC
        if: inputs.script == '' || inputs.script == 'All' || inputs.script == '4-week Page GSC'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/monthly_page_gsc.py --date "$RUN_DATE"
          else
            python scripts/monthly_page_gsc.py
          fi

      - name: Run 4-week Site GSC
        if: inputs.script == '' || inputs.script == 'All' || inputs.script == '4-week Site GSC'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/monthly_site_gsc.py --date "$RUN_DATE"
          else
            python scripts/monthly_site_gsc.py
          fi
