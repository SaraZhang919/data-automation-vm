name: Weekly Sunday

on:
  schedule:
    - cron: "0 7 * * 0"   # 4 PM JST (UTC+9) every Sunday
  workflow_dispatch:
    inputs:
      run_date:
        description: "Reference date (YYYY-MM-DD). Use a past Sunday to test."
        required: false
        default: ""
      script:
        description: "Which script to run"
        required: false
        default: "All"
        type: choice
        options:
          - All
          - Weekly Site GA4
          - Weekly Page GA4

jobs:
  weekly-sunday:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly site GA4
        if: inputs.script == '' || inputs.script == 'All' || inputs.script == 'Weekly Site GA4'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/weekly_site_ga4.py --date "$RUN_DATE"
          else
            python scripts/weekly_site_ga4.py
          fi

      - name: Run weekly page GA4
        if: inputs.script == '' || inputs.script == 'All' || inputs.script == 'Weekly Page GA4'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/weekly_page_ga4.py --date "$RUN_DATE"
          else
            python scripts/weekly_page_ga4.py
          fi
