name: Weekly Sunday

on:
  schedule:
    - cron: "0 7 * * 0"   # 4 PM JST (UTC+9) every Sunday
  workflow_dispatch:
    inputs:
      run_date:
        description: "Reference date (YYYY-MM-DD). Use a past Sunday to test."
        required: false
        default: ""

jobs:
  weekly-sunday:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly site GA4
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/weekly_site_ga4.py --date "$RUN_DATE"
          else
            python scripts/weekly_site_ga4.py
          fi

      - name: Run weekly page GA4
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/weekly_page_ga4.py --date "$RUN_DATE"
          else
            python scripts/weekly_page_ga4.py
          fi
