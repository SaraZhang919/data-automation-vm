name: Weekly Tuesday

on:
  schedule:
    - cron: "0 7 * * 2"   # 4 PM JST (UTC+9) every Tuesday
  workflow_dispatch:
    inputs:
      run_date:
        description: "Reference date (YYYY-MM-DD). Use a past Tuesday to test."
        required: false
        default: ""
      script:
        description: "Which script to run"
        required: false
        default: "All"
        type: choice
        options:
          - All
          - Weekly Page GSC
          - Weekly Brand GSC
          - Weekly Site GSC

jobs:
  weekly-tuesday:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly page GSC
        if: inputs.script == '' || inputs.script == 'All' || inputs.script == 'Weekly Page GSC'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/weekly_page_gsc.py --date "$RUN_DATE"
          else
            python scripts/weekly_page_gsc.py
          fi

      - name: Run weekly brand GSC
        if: inputs.script == '' || inputs.script == 'All' || inputs.script == 'Weekly Brand GSC'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/weekly_brand_gsc.py --date "$RUN_DATE"
          else
            python scripts/weekly_brand_gsc.py
          fi

      - name: Run Weekly Site GSC
        if: inputs.script == '' || inputs.script == 'All' || inputs.script == 'Weekly Site GSC'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/weekly_site_gsc.py --date "$RUN_DATE"
          else
            python scripts/weekly_site_gsc.py
          fi
