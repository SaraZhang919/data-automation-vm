name: Event Check — iBoomto

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date YYYY-MM-DD (inclusive, GA4 property timezone)
        required: true
        type: string
      end_date:
        description: End date YYYY-MM-DD (inclusive; same date for a single day)
        required: true
        type: string
      language:
        description: Website language; all also generates all-language event totals
        type: choice
        options: [all, en, ar, ja, zh-tw, es, de, fr, it, pt]
        default: all
      event_names:
        description: Names/fragments separated by spaces, commas or |; blank or all includes every event
        type: string
        default: all
      event_match:
        description: Exact names (case-sensitive) or contains (case-insensitive, OR)
        type: choice
        options: [exact, contains]
        default: exact

permissions:
  contents: read
concurrency:
  group: iboomto-sheets-writer
  cancel-in-progress: false

jobs:
  event-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-iboomto.txt
      - run: python -m unittest discover -s tests -p 'test_event_check.py' -v
      - run: python -m unittest discover -s tests -p 'test_storage_formatting.py' -v
      - name: Query events and write all three report views
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          IBOOMTO_SHEET_ID: '1Iw07GRTmwK4GoE3zPpGYG-rdneBHchYIb6-s-knFLvs'
          INPUT_START: ${{ inputs.start_date }}
          INPUT_END: ${{ inputs.end_date }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_EVENT_NAMES: ${{ inputs.event_names }}
          INPUT_EVENT_MATCH: ${{ inputs.event_match }}
        run: python -m iboomto.event_check --write
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/event-check.json
          if-no-files-found: warn
          retention-days: 30
