name: Daily GA4

on:
  schedule:
    - cron: "0 7 * * *"   # 4 PM JST (UTC+9) every day
  workflow_dispatch:
    inputs:
      run_date:
        description: "Reference date (YYYY-MM-DD). Defaults to today."
        required: false
        default: ""

jobs:
  daily-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily GA4 script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RUN_DATE: ${{ github.event.inputs.run_date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/daily_ga4.py --date "$RUN_DATE"
          else
            python scripts/daily_ga4.py
          fi
